services:
  nexus-kernel-base:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.base
      target: kernel-base
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      MISE_DATA_DIR: /opt/mise
      MISE_CONFIG_DIR: /etc/mise
      MISE_CACHE_DIR: /opt/mise/cache
      FIREWALL_MODULES: ${FIREWALL_MODULES:-all}

  # Generic beads server — the org's shared task graph. A `dolt sql-server` over
  # $BEADS_DATA_DIR, which consumers back with a named volume; without one the
  # graph dies with the container. No container_name / image / volume here —
  # downstream consumers set those when they extend this service.
  #
  # 3307 is reachable on the compose network only, deliberately NOT published to
  # the host: v1 runs credential-free (root, no password), so a host publish
  # would put an unauthenticated SQL server on the operator's machine. Set
  # BEADS_DOLT_PASSWORD on this service before widening exposure — the same
  # variable name configures the clients.
  #
  # No cap_add: this service doesn't run the kernel firewall (it serves rather
  # than reaches out). Clients that DO run the firewall reach it fine — the
  # firewall allows the container's own compose networks.
  beads:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.base
      target: beads-server
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    command: /usr/local/bin/entrypoint-beads.sh
    expose:
      - "${BEADS_PORT:-3307}"
    environment:
      BEADS_DATA_DIR: ${BEADS_DATA_DIR:-/beads}
      BEADS_PORT: ${BEADS_PORT:-3307}
      # The dolt server is the stamping authority for any column with
      # DEFAULT/ON UPDATE CURRENT_TIMESTAMP (beads' issues.updated_at):
      # server wall-clock lands in naive DATETIME columns. Pin the server
      # process to UTC so a local-TZ image default can never mint
      # local-time stamps that read as UTC (context:
      # https://github.com/LatentLabsSpace/beads/pull/1).
      TZ: "UTC"
    # Lets a consumer gate its agents on `depends_on: {beads: {condition:
    # service_healthy}}` instead of racing the server's first-boot init.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/${BEADS_PORT:-3307}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Generic hermes-agent service built from the `hermes` image target. No
  # container_name / image / volume here — downstream consumers set those (and
  # any per-agent env_file) when they extend this service. The baked entrypoint
  # bootstraps the workspace, links agent state under quarters/crew/$AGENT_NAME,
  # initializes the firewall, then runs hermes in $HERMES_MODE. Defaults to
  # HERMES_MODE=sleep so the container boots for VS Code attach even before any
  # platform credentials are configured.
  hermes:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.base
      target: hermes
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    command: /usr/local/bin/entrypoint-hermes.sh
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      MISE_DATA_DIR: /opt/mise
      MISE_CONFIG_DIR: /etc/mise
      MISE_CACHE_DIR: /opt/mise/cache
      FIREWALL_MODULES: ${FIREWALL_MODULES:-all}
      # --- Workspace bootstrap (entrypoint-base contract) ---
      AGENT_NAME: ${AGENT_NAME:-hermes}
      NEXUS_REPO_URL: ${NEXUS_REPO_URL:-}
      NEXUS_TARGET_BRANCH: ${NEXUS_TARGET_BRANCH:-dev}
      # Host-shell fallback for first-boot clone auth; a per-agent env_file's
      # GH_TOKEN wins inside the bootstrap.
      HOST_GH_TOKEN: ${GH_TOKEN:-}
      # --- Hermes runtime ---
      HERMES_MODE: ${HERMES_MODE:-sleep}
      HERMES_WORKSPACE_PATH: ${HERMES_WORKSPACE_PATH:-/workspace}
      HERMES_HOME: /home/node/.hermes
      HERMES_SOUL_PATH: /home/node/.hermes/SOUL.md
      # --- Beads client (bd ships in the image via beads-base) ---
      # Opt-in by design: set BEADS_DOLT_SERVER_MODE=1 in the consumer's env
      # once a `beads` service exists. Left empty, bd falls back to its embedded
      # single-writer engine, so a consumer with no beads service still works.
      BEADS_DOLT_SERVER_MODE: ${BEADS_DOLT_SERVER_MODE:-}
      BEADS_DOLT_SERVER_HOST: ${BEADS_DOLT_SERVER_HOST:-beads}
      BEADS_DOLT_SERVER_PORT: ${BEADS_DOLT_SERVER_PORT:-3307}
      BEADS_DOLT_SERVER_USER: ${BEADS_DOLT_SERVER_USER:-root}
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:-}

  # Generic Gas City service — a bead-native city running against the shared
  # beads server. No container_name / image / volume here — downstream
  # consumers set those when they extend this service; mount a named volume at
  # $GC_CITY_DIR or the city (like the beads graph without its volume) dies
  # with the container.
  #
  # `init: true` because gc does not reap children: bd/dolt/git processes that
  # reparent to PID 1 pile up as zombies otherwise. The fork's own container
  # images run tini for exactly this; docker's built-in init is the same thing
  # without baking a binary into the image.
  #
  # NOTE on `extends:` and depends_on: older compose releases dropped
  # depends_on across extends; compose v5 carries it through (observed
  # v5.3.1). Either way the consumer must own the block: re-declare it
  # against the consumer's beads service name, with `!override` so the
  # inherited reference to the generic `beads` name (undefined in the
  # consumer's project) is replaced rather than merged alongside.
  gascity:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.base
      target: gascity
      args:
        TZ: ${TZ:-America/Los_Angeles}
        CLAUDE_CODE_VERSION: latest
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    init: true
    command: /usr/local/bin/entrypoint-gascity.sh
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      MISE_DATA_DIR: /opt/mise
      MISE_CONFIG_DIR: /etc/mise
      MISE_CACHE_DIR: /opt/mise/cache
      FIREWALL_MODULES: ${FIREWALL_MODULES:-all}
      # --- Workspace bootstrap (entrypoint-base contract) ---
      NEXUS_REPO_URL: ${NEXUS_REPO_URL:-}
      NEXUS_BRANCH: ${NEXUS_BRANCH:-dev}
      # --- City runtime ---
      GC_CITY_DIR: ${GC_CITY_DIR:-/city}
      GC_TEMPLATE: ${GC_TEMPLATE:-gascity}
      GC_DEFAULT_PROVIDER: ${GC_DEFAULT_PROVIDER:-claude}
      GC_RIG_NAME: ${GC_RIG_NAME:-}
      # --- Beads client (shared-server wiring; see entrypoint-gascity.sh) ---
      # Unlike hermes, no BEADS_DOLT_SERVER_MODE here: the endpoint is pinned
      # at the gc level via the hosted-Dolt init flags, and bd's env-first
      # resolution would let a blanket env override the per-scope configs gc
      # writes. HOST/PORT/USER feed the init flags; the city's bd database
      # defaults to "beads", the same one plain bd clients land in.
      BEADS_DOLT_SERVER_HOST: ${BEADS_DOLT_SERVER_HOST:-beads}
      BEADS_DOLT_SERVER_PORT: ${BEADS_DOLT_SERVER_PORT:-3307}
      BEADS_DOLT_SERVER_USER: ${BEADS_DOLT_SERVER_USER:-root}
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:-}
      GC_DOLT_DATABASE: ${GC_DOLT_DATABASE:-beads}
      GC_BEADS_PROJECT_ID: ${GC_BEADS_PROJECT_ID:-city}
    # Don't race the server's first-boot init (re-declare when extending —
    # see the NOTE above).
    depends_on:
      beads:
        condition: service_healthy