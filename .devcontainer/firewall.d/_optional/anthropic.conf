# Anthropic API — Claude Code (and hermes' anthropic provider) cannot work
# without it, but it is not a boot-blocker: a DNS miss here should degrade the
# agent, not brick the container. Moved from _required/ so consumers that don't
# use Anthropic at all (e.g. a Fireworks-only fleet) can drop it via
# FIREWALL_KERNEL_MODULES. Telemetry endpoints (sentry, statsig) live separately
# in anthropic-telemetry.conf.
api.anthropic.com
