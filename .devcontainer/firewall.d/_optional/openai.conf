# OpenAI — endpoints the Codex CLI (@openai/codex, installed in kernel-base) uses.
# Taken from the strings in the shipped codex binary (v0.157.0), not guessed.
#
# api.openai.com  — Responses API when Codex runs on an OPENAI_API_KEY
#                   (also hermes' openai provider)
# auth.openai.com — `codex login` sign-in and token refresh
# chatgpt.com     — ChatGPT-plan sign-in: the Codex backend lives at
#                   chatgpt.com/backend-api/codex. Cloudflare-fronted, so its
#                   IPs can rotate after boot like any CDN host; a restart
#                   re-resolves.
api.openai.com
auth.openai.com
chatgpt.com
