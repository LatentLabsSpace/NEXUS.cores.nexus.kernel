# Fireworks AI — API and console endpoints used by firectl.
#
# api.fireworks.ai — inference/API base used by firectl and the SDKs
# app.fireworks.ai — dashboard/console used by `firectl signin` (device-code
# style browser auth flow) and API key management
# gateway.fireworks.ai — gRPC endpoint firectl uses for deploy/model-management
# commands (separate from the REST api.fireworks.ai
# host/IP; without this, firectl gets "no route to
# host" even when the REST API key/auth is fine)
api.fireworks.ai
app.fireworks.ai
gateway.fireworks.ai